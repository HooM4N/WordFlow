#=====================#
#     PATHS SETUP     #
#=====================#
train_data_path: data/science_of_getting_rich.txt
val_data_path: null
models_dir: models/
checkpoint_path: null
glove_embeddings_path: null

#==========================#
#     GENERAL SETTINGS     #
#==========================#
seed: 42
training_mode: statefull
use_accelerator: true

#=======================#
#     DATA SETTINGS     #
#=======================#
seq_len: 12
min_seq_len: 8
max_vocab_size: 20000

get_data_params:
  min_token_thresh: 20
  chunk_separator: "\n\n"
  entity_replacement: false

val_split_enable: true
val_split_ratio: 0.12
val_split_shuffle: true

#=========================#
#     TRAINING PARAMS     #
#=========================#
n_epochs: 2
batch_size: 32
enable_mixed_precision: true

early_stopping_epsilon: 0.0003
early_stopping_patience: 3
grad_clip_norm: 0.25

#=======================================#
#     PRETRAINED EMBEDDING SETTINGS     #
#=======================================#
use_glove_embeddings: false
glove_dim: 200

#======================#
#     MODEL PARAMS     #
#======================#
model_params:
 rnn_type: GRU
 embedding_dim: 16
 hidden_dim: 16
 num_layers: 2
 
 emb_dropout_p: 0.15
 rnn_dropout_p: 0.3
 out_dropout_p: 0.4
 
 proj_nonlinearity: false
 freeze_pretrained_embeddings: true

#=================================#
#     LEARNING RATE SCHEDULER     #
#=================================#
lr_scheduler_params:
 factor: 0.5
 patience: 2
 threshold: 0.002

#==========================#
#     OPTIMIZER PARAMS     #
#==========================#
optimizer_params:
  lr: 0.002
  weight_decay: 0.00002