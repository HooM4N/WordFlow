#=====================#
#     PATHS SETUP     #
#=====================#
train_data_path: data/simple_stories_filtered.txt
val_data_path: null
models_dir: models/
checkpoint_path: null
glove_embeddings_path: null

#==========================#
#     GENERAL SETTINGS     #
#==========================#
seed: 212
training_mode: varlen # [ sliding / varlen / bptt ]
use_accelerator: true

#=======================#
#     DATA SETTINGS     #
#=======================#
seq_len: 170
min_seq_len: 20
max_vocab_size: 25000

get_data_params:
  min_token_thresh: 15
  chunk_separator: "\n\n"
  entity_replacement: false
  add_special_tokens: true
  shuffle: true
  preprocess: true
  # Preprocessing params
  preprocess_kwargs:
   lowercase: true
   remove_parenthesized_content: false
   punctuations: keep 
   essential_punctuations: [".", "'", ","]
   collapse_multiple_dots: false
   remove_non_ascii: true
   bucketize_numbers: true
 
do_val_split: true
val_split_ratio: 0.1
val_split_shuffle: true

tokenizer_lowercase: true

#=========================#
#     TRAINING PARAMS     #
#=========================#
n_epochs: 60
batch_size: 128
enable_mixed_precision: true

early_stopping_epsilon: 0.0008
early_stopping_patience: 4
grad_clip_norm: 1.0

#=======================================#
#     PRETRAINED EMBEDDING SETTINGS     #
#=======================================#
use_glove_embeddings: false
glove_dim: 200

#======================#
#     MODEL PARAMS     #
#======================#
model_params:
 rnn_type: GRU
 embedding_dim: 300
 hidden_dim: 512
 num_layers: 2
 tie_weights: true
 
 emb_dropout_p: 0.2
 rnn_dropout_p: 0.25
 out_dropout_p: 0.2
 
 proj_nonlinearity: false
 freeze_pretrained_embeddings: true

#=================================#
#     LEARNING RATE SCHEDULER     #
#=================================#
lr_scheduler_params:
 factor: 0.5
 patience: 2
 threshold: 0.006

#==========================#
#     OPTIMIZER PARAMS     #
#==========================#
optimizer_params:
  lr: 0.002
  weight_decay: 0.00002