#=====================#
#     PATHS SETUP     #
#=====================#
train_data_path: data/science_of_getting_rich.txt
val_data_path: null
models_dir: models/
checkpoint_path: null
glove_embeddings_path: null

#==========================#
#     GENERAL SETTINGS     #
#==========================#
seed: 42
training_mode: stateless
use_accelerator: true

#=======================#
#     DATA SETTINGS     #
#=======================#
seq_len: 16
min_seq_len: 8
max_vocab_size: 16000

get_data_params:
  min_token_thresh: 20
  chunk_separator: "\n\n"
  entity_replacement: false

val_split_enable: true
val_split_ratio: 0.15
val_split_shuffle: false

#=========================#
#     TRAINING PARAMS     #
#=========================#
n_epochs: 5
batch_size: 32
enable_mixed_precision: true

early_stopping_epsilon: 0.0003
early_stopping_patience: 3
grad_clip_norm: 0.25

#=======================================#
#     PRETRAINED EMBEDDING SETTINGS     #
#=======================================#
use_glove_embeddings: false
glove_dim: 200

#======================#
#     MODEL PARAMS     #
#======================#
model_params:
 embedding_dim: 128
 hidden_dim: 128
 num_layers: 2
 
 emb_dropout_p: 0.1
 lstm_dropout_p: 0.1
 out_dropout_p: 0.1
 
 proj_nonlinearity: false
 freeze_pretrained_embeddings: true

#=================================#
#     LEARNING RATE SCHEDULER     #
#=================================#
lr_scheduler_params:
 factor: 0.5
 patience: 2
 threshold: 0.002

#==========================#
#     OPTIMIZER PARAMS     #
#==========================#
optimizer_params:
  lr: 0.002
  weight_decay: 0.00002